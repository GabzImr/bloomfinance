<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <h2>Bloom Finance</h2>
</header>

<div class="main">

  <div class="grid">

  <div class="card purple">
    <input class="nome" placeholder="Categoria">
    <input class="valor" type="number" placeholder="Valor">
  </div>

  <div class="card red">
    <input class="nome" placeholder="Categoria">
    <input class="valor" type="number" placeholder="Valor">
  </div>

  <div class="card orange">
    <input class="nome" placeholder="Categoria">
    <input class="valor" type="number" placeholder="Valor">
  </div>

  <div class="card green">
    <input class="nome" placeholder="Categoria">
    <input class="valor" type="number" placeholder="Valor">
  </div>

  <div class="card blue">
    <input class="nome" placeholder="Categoria">
    <input class="valor" type="number" placeholder="Valor">
  </div>

</div>

  <div class="side">
    <div class="chart">
      <div class="center">
        <span>Total</span>
        <strong id="saldo">R$ 0</strong>
      </div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
