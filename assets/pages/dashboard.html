<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<link rel="stylesheet" href="../style/style.css">
</head>
<body>
<header class="top">
  
  <div class="left-nav">
    <img src="../img/logo.png" class="logo-nav">
    <h2>Bloom Finance</h2>
  </div>

  <nav>
    <a class="active">Início</a>
    <a>Sobre</a>
    <a>Contato</a>
    <a>Blogs</a>
  </nav>

  <div class="icons">
    <div class="user"></div>
    <div class="gear">⚙</div>
  </div>

</header>


<div class="main">

  <div class="grid">

    <div class="card purple" data-cor="#7a3cff" style="background:#7a3cff;">
      <input class="nome" placeholder="Categoria">
      <input class="valor" type="number" placeholder="Valor">
    </div>

    <div class="card red" data-cor="#ff2a2a" style="background:#7a0000;">
      <input class="nome" placeholder="Categoria">
      <input class="valor" type="number" placeholder="Valor">
    </div>

    <div class="card orange" data-cor="#ff9900" style="background:#ff9900;">
      <input class="nome" placeholder="Categoria">
      <input class="valor" type="number" placeholder="Valor">
    </div>

    <div class="card green" data-cor="#0f7a5c" style="background:#0f7a5c;">
      <input class="nome" placeholder="Categoria">
      <input class="valor" type="number" placeholder="Valor">
    </div>

    <div class="card blue" data-cor="#1c4ea3" style="background:#1c4ea3;">
      <input class="nome" placeholder="Categoria">
      <input class="valor" type="number" placeholder="Valor">
    </div>

  </div>

  <div class="side">
    <div class="chart">
      <div class="center">
        <span>Total</span>
        <strong id="saldo">R$ 0</strong>
      </div>
    </div>
  </div>

</div>

<script src="../js/script.js"></script>
</body>
</html>
